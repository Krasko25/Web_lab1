<main id="contacts">
    <section>
        <h1>Обратная связь</h1>
        <p>Заполните форму ниже, чтобы связаться с нами.</p>

        <form action="#" method="post">
            <fieldset>
                <legend>Форма обратной связи</legend>

                <label for="name">Имя:</label>
                <input type="text" id="name" name="name" required minlength="2" placeholder="Ваше имя">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="text@example.com">

                <label for="message">Сообщение:</label>
                <textarea id="message" name="message" rows="5" required minlength="10"
                          placeholder="Ваше сообщение"></textarea>

                <button type="submit">Отправить</button>

                <output name="result"></output>
            </fieldset>
        </form>
    </section>
